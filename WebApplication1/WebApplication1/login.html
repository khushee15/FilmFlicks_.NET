<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - FilmFlicks</title>
  
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
  <!-- Custom CSS Files -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <!-- ==========================================================================
       STICKY NAVBAR
       ========================================================================== -->
  <nav class="navbar navbar-expand-lg fixed-top glass-nav navbar-dark">
    <div class="container">
      <a class="navbar-brand fw-bold fs-3" href="index.html" style="background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
        <i class="bi bi-film me-2 text-primary"></i>FilmFlicks
      </a>
      
      <div class="ms-auto d-flex gap-2">
        <a href="index.html" class="btn btn-outline-light btn-sm px-3 fw-semibold"><i class="bi bi-house me-1"></i>Home</a>
        <a href="register.html" class="btn btn-crimson btn-sm px-3">Register</a>
      </div>
    </div>
  </nav>

  <!-- ==========================================================================
       LOGIN FORM SECTION
       ========================================================================== -->
  <main class="container auth-wrapper" style="padding-top: 100px;">
    <div class="auth-card">
      <div class="text-center mb-4">
        <h2 class="auth-title mb-1">Welcome Back</h2>
        <p class="text-white-50 small">Log in to continue downloading high quality movies</p>
      </div>

      <!-- Social Login Buttons -->
      <div class="d-grid gap-2 mb-3">
        <a href="#" class="btn-social">
          <i class="bi bi-google text-danger fs-5"></i> Continue with Google
        </a>
      </div>

      <div class="divider-text">
        <span>OR LOGIN WITH EMAIL</span>
      </div>

      <!-- Login Form -->
      <form action="index.html" method="GET">
        <!-- Email Input -->
        <div class="form-floating mb-3">
          <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com" required>
          <label for="floatingInput"><i class="bi bi-envelope me-2"></i>Email Address</label>
        </div>

        <!-- Password Input -->
        <div class="form-floating mb-3">
          <input type="password" class="form-control" id="floatingPassword" placeholder="Password" required>
          <label for="floatingPassword"><i class="bi bi-lock me-2"></i>Password</label>
        </div>

        <!-- Remember Me & Forgot Password -->
        <div class="d-flex justify-content-between align-items-center mb-4 small">
          <div class="form-check">
            <input class="form-check-input bg-dark border-secondary" type="checkbox" id="rememberMe">
            <label class="form-check-label text-white-50" for="rememberMe">Remember me</label>
          </div>
          <a href="forgot-password.html" class="text-decoration-none" style="color: var(--accent-purple);">Forgot Password?</a>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-crimson w-100 py-2 fs-6 fw-bold">
          <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
        </button>
      </form>

      <!-- Registration Link -->
      <div class="text-center mt-4 small text-white-50">
        Don't have an account? <a href="register.html" class="fw-bold text-decoration-none" style="color: var(--accent-purple);">Register Now</a>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="text-center text-white-50 py-3 small">
    © 2026 FilmFlicks. All rights reserved.
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/bootstrap.bundle.min.js"></script>
</body>
</html>
