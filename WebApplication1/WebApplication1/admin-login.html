<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Authorization - FilmFlicks</title>
  
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
  <!-- Custom CSS Files -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/admin-login.css">
</head>
<body class="bg-dark">

  <!-- ==========================================================================
       ADMIN LOGIN CONTAINER (#admin-login)
       ========================================================================== -->
  <div id="admin-login" class="admin-login-wrapper">
    
    <!-- High-Contrast Security Card -->
    <div class="security-card">
      
      <!-- Security Badge Header -->
      <div class="text-center mb-4">
        <div class="security-badge">
          <i class="bi bi-shield-lock-fill"></i>
        </div>
        <h4 class="fw-bold text-white mb-1">Admin Portal</h4>
        <p class="text-white-50 small mb-0">Authorized Personnel Only</p>
      </div>

      <!-- Authorization Form -->
      <form action="admin-dashboard.html" method="POST">
        
        <!-- Field 1: Admin Username -->
        <div class="mb-4">
          <label for="adminUsername" class="form-label">Admin Username</label>
          <div class="input-icon-wrapper">
            <input type="text" class="form-control" id="adminUsername" placeholder="Enter admin username" autocomplete="off" required>
            <i class="bi bi-person-badge-fill"></i>
          </div>
        </div>

        <!-- Field 2: Master Key Authorization Code -->
        <div class="mb-4">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label for="masterKey" class="form-label mb-0">Master Key Authorization</label>
            <span class="badge bg-danger-subtle text-danger border border-danger-subtle rounded-pill small" style="font-size: 0.7rem;">Secured</span>
          </div>
          <div class="input-icon-wrapper">
            <input type="password" class="form-control master-key-input" id="masterKey" placeholder="••••••••••••" required>
            <i class="bi bi-key-fill"></i>
          </div>
        </div>

        <!-- Submit Action Button -->
        <div class="d-grid mt-4">
          <button type="submit" class="btn btn-admin-login">
            <i class="bi bi-unlock-fill me-2"></i>Authorize Access
          </button>
        </div>

      </form>

      <!-- Security Notice Footer -->
      <div class="mt-4 pt-3 border-top border-secondary border-opacity-25 text-center">
        <a href="index.html" class="text-white-50 text-decoration-none small hover-white">
          <i class="bi bi-arrow-left me-1"></i> Return to Main Website
        </a>
      </div>

    </div>

  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/bootstrap.bundle.min.js"></script>
</body>
</html>
