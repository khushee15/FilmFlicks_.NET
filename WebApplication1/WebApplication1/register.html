<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - FilmFlicks</title>
  
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
  <!-- Custom CSS Files -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/register.css">
</head>
<body>

  <!-- ==========================================================================
       STICKY NAVBAR
       ========================================================================== -->
  <nav class="navbar navbar-expand-lg fixed-top glass-nav navbar-dark">
    <div class="container">
      <a class="navbar-brand fw-bold fs-3" href="index.html" style="background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
        <i class="bi bi-film me-2 text-primary"></i>FilmFlicks
      </a>
      
      <div class="ms-auto d-flex gap-2">
        <a href="index.html" class="btn btn-outline-light btn-sm px-3 fw-semibold"><i class="bi bi-house me-1"></i>Home</a>
        <a href="login.html" class="btn btn-outline-light btn-sm px-3 fw-semibold">Login</a>
      </div>
    </div>
  </nav>

  <!-- ==========================================================================
       REGISTER FORM SECTION
       ========================================================================== -->
  <main class="container auth-wrapper" style="padding-top: 100px;">
    <div class="auth-card-wide">
      <div class="text-center mb-4">
        <h2 class="auth-title mb-1">Create an Account</h2>
        <p class="text-white-50 small">Join FilmFlicks to request movies and build your watchlist</p>
      </div>

      <!-- Quick Social SignUp -->
      <div class="d-grid gap-2 mb-3">
        <a href="#" class="btn-social">
          <i class="bi bi-google text-danger fs-5"></i> Sign up with Google
        </a>
      </div>

      <div class="divider-text">
        <span>OR FILL YOUR DETAILS</span>
      </div>

      <!-- Registration Form -->
      <form action="login.html" method="GET">
        <div class="row g-3">
          <!-- Full Name Input -->
          <div class="col-12 col-md-6">
            <div class="form-floating">
              <input type="text" class="form-control" id="floatingName" placeholder="John Doe" required>
              <label for="floatingName"><i class="bi bi-person me-2"></i>Full Name</label>
            </div>
          </div>

          <!-- Username Input -->
          <div class="col-12 col-md-6">
            <div class="form-floating">
              <input type="text" class="form-control" id="floatingUsername" placeholder="johndoe123" required>
              <label for="floatingUsername"><i class="bi bi-at me-2"></i>Username</label>
            </div>
          </div>

          <!-- Email Input -->
          <div class="col-12">
            <div class="form-floating">
              <input type="email" class="form-control" id="floatingEmail" placeholder="name@example.com" required>
              <label for="floatingEmail"><i class="bi bi-envelope me-2"></i>Email Address</label>
            </div>
          </div>

          <!-- Password Input -->
          <div class="col-12 col-md-6">
            <div class="form-floating">
              <input type="password" class="form-control" id="floatingPassword" placeholder="Password" required>
              <label for="floatingPassword"><i class="bi bi-lock me-2"></i>Password</label>
            </div>
          </div>

          <!-- Confirm Password Input -->
          <div class="col-12 col-md-6">
            <div class="form-floating">
              <input type="password" class="form-control" id="floatingConfirmPassword" placeholder="Confirm Password" required>
              <label for="floatingConfirmPassword"><i class="bi bi-shield-lock me-2"></i>Confirm Password</label>
            </div>
          </div>
        </div>

        <!-- Terms & Conditions Checkbox -->
        <div class="form-check mt-3 mb-4">
          <input class="form-check-input bg-dark border-secondary" type="checkbox" id="termsCheck" required>
          <label class="form-check-label text-white-50 small" for="termsCheck">
            I agree to the <a href="#" class="text-decoration-none" style="color: var(--accent-purple);">Terms of Service</a> and <a href="#" class="text-decoration-none" style="color: var(--accent-purple);">Privacy Policy</a>.
          </label>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-crimson w-100 py-2 fs-6 fw-bold">
          <i class="bi bi-person-plus me-2"></i>Create Account
        </button>
      </form>

      <!-- Login Link -->
      <div class="text-center mt-4 small text-white-50">
        Already have an account? <a href="login.html" class="fw-bold text-decoration-none" style="color: var(--accent-purple);">Login Here</a>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="text-center text-white-50 py-3 small">
    © 2026 FilmFlicks. All rights reserved.
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/bootstrap.bundle.min.js"></script>
</body>
</html>
